name: Build RangIA APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild RangIA source
        shell: bash
        run: |
          cat payload/part_00.b64 payload/part_01.b64 payload/part_02.b64 payload/part_03.b64 payload/part_04.b64 > /tmp/rangia.b64
          base64 --decode /tmp/rangia.b64 > /tmp/rangia.zip
          mkdir -p /tmp/rangia-src
          unzip -q /tmp/rangia.zip -d /tmp/rangia-src
          test -f /tmp/rangia-src/RangIA/settings.gradle.kts

      - name: Apply Android compile fixes
        shell: bash
        run: |
          sed -i '/    buildFeatures {/i\    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n' /tmp/rangia-src/RangIA/app/build.gradle.kts
          MAIN=/tmp/rangia-src/RangIA/app/src/main/java/com/rangia/app/MainActivity.kt
          sed -i '1i@file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class)\n' "$MAIN"
          head -n 5 "$MAIN"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: /tmp/rangia-src/RangIA
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RangIA-debug-apk
          path: /tmp/rangia-src/RangIA/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
